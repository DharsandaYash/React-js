<html>
    <head>
        <script>
                var a=prompt("enter the value of a");
                var b=prompt("enter the value of b");
                var c=prompt("enter the value of c");

                if(a>b && a>c){
                    document.write("A IS BIG");
                }
                else if(b>a && b>c){
                    document.write("B IS BIG");
                }
                else if(c>a && c>b){
                    document.write("C IS BIG");
                }
                else{
                    document.write("BOTH ARE SAME");
                }
        </script>
    </head>
</html>
