<html>
    <head>
        <script>
                var a=Number(prompt("Enter The Day Number: "));
                switch(a)
                {
                    case 1:
                        document.write("Monday");
                        break;
                    case 2:
                        document.write("Tuesday");
                        break;
                    case 3:
                        document.write("Wednesday");
                        break;
                    case 4:
                        document.write("Thuresday");
                        break;
                    case 5:
                        document.write("Friday");
                        break;
                    case 6:
                        document.write("Saturday");
                        break;
                    case 7:
                        document.write("Sunday");
                        break;
                    default:
                        document.write("Invalid Value");
                        break;
                }
               
        </script>
    </head>
</html>
