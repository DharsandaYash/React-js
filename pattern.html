<html>
    <head>
        <script>
                var a=prompt("enter the value of a");
                for(i=0;i<a;i++)
                {
                    for(j=0;j<=i;j++)
                    {
                        document.write("*")
                    }
                    document.write("<br>")
                }
        </script>
    </head>
</html>
