<html>
<head>
    <script>

        var str=prompt("1.lowercase\n2.uppercase\nEnter the operation");
        var a=prompt("Enter The String");
        switch(str)
        {
            case "1":
                document.write("Lowercase: "+a.toLowerCase());
                break;
            case "2":
                document.write("Uppercase: "+a.toUpperCase());
                break;
            default:
                document.write("Tame Je Kidhu ee Thay Sake Em Nathi");
        }

    </script>
</head>

</body>

</html>
